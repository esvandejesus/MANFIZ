[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manfiz-toolbox"
version = "0.1.0"
description = "Shared-premise neuro-fuzzy zonotopic system identification in Python"
authors = [{name = "Esvan-Jesús Pérez-Pérez"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
comparisons = ["scikit-learn>=1.3"]
all = ["matplotlib>=3.7", "scikit-learn>=1.3"]

[project.scripts]
manfiz-benchmark = "manfiz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
